      if (!text || text.trim() === '') return 'Not provided.';
      const lines = text.split('\n').filter(line => line.trim() !== '');

      const hasBullet = lines.some(line => /^[\s]*[•\-*]/.test(line.trim()));

        ['Week 10', 'Visualization Exercise 10'],

        ['Week 14', 'Final Visualization Project — presentation'],

      ],
      'STAT415-01': [
        ['Week 1', 'Data Mining Exercise 1 / software setup'],
        ['Week 2', 'Data Exploration Assignment'],
        ['Week 3', 'Data Preparation Assignment; Project proposal'],
        ['Week 4', 'Regression Assignment; Midterm Exam 1'],
        ['Week 5', 'Logistic Regression Assignment'],
        ['Week 6', 'Decision Tree Assignment'],
        ['Week 7', 'KNN / SVM Assignment'],
        ['Week 8', 'Neural Network Assignment; Midterm Exam 2'],

        ['Week 10', 'Model Validation Assignment'],
        ['Week 11', 'Model Evaluation / ROC-AUC Assignment'],
        ['Week 12', 'Lift Chart & Feature Importance Assignment'],
        ['Week 13', 'Model Selection Report'],
        ['Week 14', 'Final Data Mining Project — complete analysis due'],
        ['Week 15', 'Final Project Presentation; Comprehensive Review'],
        ['Week 16', 'Final Exam; Final Project / Portfolio Due']
      ]
    };

    function getCourseworkDue(key, weekLabel) {
      const items = courseworkSchedules[key] || [];
      const match = items.find(item => item[0].toLowerCase() === weekLabel.toLowerCase());
      return match ? match[1] : '';
    }

    function formatScheduleWithDueDates(text, key) {
      if (!text || text.trim() === '') return 'Not provided.';
      const lines = text.split('\n').filter(line => line.trim() !== '');
      if (lines.length === 0) return 'Not provided.';
      let tableHTML = `<table class="schedule-table">
        <thead><tr><th>Week</th><th>Topics / Activities</th><th>Coursework Due</th></tr></thead><tbody>`;
      lines.forEach(line => {
        const parts = line.split(':');
        if (parts.length >= 2) {
          const week = parts[0].trim();
          const topic = parts.slice(1).join(':').trim();
          const due = getCourseworkDue(key, week);
          tableHTML += `<tr>
            <td><strong>${week}</strong></td>
            <td>${topic}</td>
            <td>${due ? `<strong>${due}</strong>` : '—'}</td>
          </tr>`;
        } else {
          tableHTML += `<tr><td colspan="3">${line}</td></tr>`;
        }
      });
      tableHTML += `</tbody></table>`;
      return tableHTML;
    }

    // Build syllabus
    function buildSyllabusHTML() {
      const title = courseTitle.value || 'Course Title';
      const instructor = instructorName.value || 'Instructor';
      const days = meetingDays.value || 'TBD';
      const times = meetingTimes.value || 'TBD';
      const room = classroom.value || 'TBD';
      const office = officeHours.value || 'TBD';
      const desc = courseDescription.value || 'Course description not provided.';
      const outcomes = learningOutcomes.value || 'Learning outcomes not listed.';
      const grading = gradingScale.value || 'Grading scale not provided.';
      const work = coursework.value || 'Coursework details not provided.';
      const textbookText = textbook.value || 'No textbook required.';
      const linksText = links.value || 'No additional links provided.';
      const scheduleText = courseSchedule.value || '';
      const selectedKey = courseSelector.value;
      const prereq = courseCatalog[selectedKey]?.prereq || 'None';

      const welcomeMessage = `<div class="statement-block" style="border-left-color: #0a2e4b; background: #eef5fa;">

      const attendancePolicy = `<div class="statement-block">

        <p>Regular attendance is expected. Absences for bereavement, medical issues, religious observances, university-sanctioned events, and court appearances will be accommodated with proper notice. Provide written notice prior to absence when possible. Make-up work arrangements must be in writing. Instructors cannot require a doctor's note for one or two absences.</p>
        <p><em>Full policy: <a href="https://policies.stcloudstate.edu/SCSU/Viewer.aspx?id=129" target="_blank">SCSU 2.05</a></em></p>
      </div>`;

      const aiStatement = `<div class="statement-block">
        <strong>Artificial Intelligence (AI) Use:</strong>
        <p>You are <strong>encouraged</strong> to use AI tools (e.g., ChatGPT, Copilot) for brainstorming, debugging, and refining work. However, AI is not a replacement for your own critical thinking.</p>
        <ul>
          <li><strong>Do:</strong> Use AI for idea generation, code assistance, and explanation.</li>
          <li><strong>Don't:</strong> Submit AI-generated content as your own without substantial revision.</li>
          <li><strong>Always:</strong> Verify AI output—you are responsible for accuracy.</li>
        </ul>
        <p><em>(Adapted from SCSU AI guidelines)</em></p>
      </div>`;

      const accessibilityStatement = `<div class="statement-block"><strong>Accessibility:</strong> This course is designed with accessibility in mind. Students with disabilities should contact Student Accessibility Services (SAS) at 320-308-4080 or sas@stcloudstate.edu.</div>`;

      const studentResponsibilities = `<div class="statement-block">
        <strong>Student Responsibilities:</strong>
        <ul>
          <li><strong>Preparation:</strong> Come to class prepared, having completed readings and preparatory work.</li>
          <li><strong>Participation:</strong> Engage actively in discussions, group work, and labs.</li>
          <li><strong>Honesty:</strong> All work must be your own. Plagiarism will result in disciplinary action.</li>
          <li><strong>Communication:</strong> Check your university email and D2L regularly.</li>
          <li><strong>Inclusivity:</strong> Respect diverse perspectives and contribute to a welcoming environment.</li>
        </ul>
      </div>`;

      const gradingPolicy = `<div class="statement-block">
        <strong>Grading and Late Work Policy:</strong>
        <ul>
          <li><strong>Homework:</strong> Due at beginning of class. No late homework without prior arrangement.</li>
          <li><strong>Exams:</strong> Scheduled dates only. Make-up for documented emergencies only.</li>
          <li><strong>Final Project:</strong> Due last day of class. Late projects lose 10% per day.</li>
          <li><strong>Incomplete (I):</strong> Only for students who have completed most work with documented emergency.</li>
        </ul>
      </div>`;

      const successTips = `<div class="statement-block" style="border-left-color: #1a7a3a; background: #f0f7f0;">
        <strong>How to Succeed:</strong>
        <ul>
          <li><strong>Attend regularly</strong> – class sessions build on each other.</li>
          <li><strong>Do the reading</strong> – preparation makes lectures more meaningful.</li>
          <li><strong>Practice</strong> – work through problems and use lab sessions.</li>
          <li><strong>Ask for help early</strong> – use office hours and tutoring resources.</li>
          <li><strong>Collaborate</strong> – form study groups to solidify understanding.</li>
          <li><strong>Stay organized</strong> – use the schedule to plan your semester.</li>
        </ul>
      </div>`;

      const outcomesHTML = formatTextToHTML(outcomes);
      const gradingHTML = formatTextToHTML(grading);
      const courseworkHTML = formatTextToHTML(work);
      const textbookHTML = formatTextToHTML(textbookText);
      const linksHTML = formatTextToHTML(linksText);
      const scheduleHTML = formatScheduleWithDueDates(scheduleText, selectedKey);

      return `
        <div class="syllabus-header">
          <h2>${title}</h2>
          <span class="scsu-badge"><i class="fas fa-university"></i> SCSU</span>
        </div>
        <div class="meta-grid">
          <strong>Instructor:</strong> <span>${instructor}</span>
          <strong>Meeting Days:</strong> <span>${days}</span>
          <strong>Meeting Times:</strong> <span>${times}</span>
          <strong>Classroom:</strong> <span>${room}</span>
          <strong>Office Hours:</strong> <span>${office}</span>
          <strong>Prerequisites:</strong> <span>${prereq}</span>
          <strong>Lecture Notes:</strong> <span><a href="${lectureNoteLink}" target="_blank">${lectureNoteLink || 'Available in Links section'}</a></span>
        </div>

        ${welcomeMessage}

        <h3><i class="fas fa-align-left" style="color:#c8102e;"></i> Course Description</h3>
        <p>${desc}</p>

        <h3><i class="fas fa-check-circle" style="color:#c8102e;"></i> Learning Outcomes</h3>
        ${outcomesHTML}

        <h3><i class="fas fa-weight-hanging" style="color:#c8102e;"></i> Grading Scale</h3>
        ${gradingHTML}

        <h3><i class="fas fa-pencil-alt" style="color:#c8102e;"></i> Coursework</h3>
        ${courseworkHTML}

        <h3><i class="fas fa-book" style="color:#c8102e;"></i> Textbook</h3>
        ${textbookHTML}

        <h3><i class="fas fa-link" style="color:#c8102e;"></i> Links & Lecture Notes</h3>
        ${linksHTML}

        <h3><i class="fas fa-calendar-alt" style="color:#c8102e;"></i> Course Schedule</h3>
        ${scheduleHTML}

        <h3><i class="fas fa-gavel" style="color:#c8102e;"></i> University Policies & Statements</h3>

        </p>
      `;
    }

    function updatePreview() {
      syllabusContent.innerHTML = buildSyllabusHTML();
    }

    updatePreview();
    document.getElementById('previewBtn').addEventListener('click', updatePreview);

    // Download functions
    function getFullSyllabusHTML() {

    }

    document.getElementById('downloadHtml').addEventListener('click', function() {
      const html = getFullSyllabusHTML();
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'syllabus.html';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('downloadWord').addEventListener('click', function() {
      const html = getFullSyllabusHTML();
      const blob = new Blob([html], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'syllabus.doc';
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('downloadPdf').addEventListener('click', function() {
      const content = syllabusContent;
      const opt = {
        margin: [0.75, 0.75, 0.75, 0.75],
        filename: 'syllabus.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, letterRendering: true, useCORS: true, logging: false },
        jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(content).save();
    });

    // Auto-update on any input change
    const inputs = document.querySelectorAll('#inputForm input, #inputForm textarea');
    inputs.forEach(inp => inp.addEventListener('input', updatePreview));
  })();
</script>
</body>
</html>
